# Per-broker execution profile.
# DEMO = exchange demo/testnet where supported, else internal paper only.
# REAL = real account, but still requires environment authorization.
# FOLLOW_TERMINAL = (MT5 only) mode follows the account logged into the terminal.
# Never put API keys/passwords in this file.
#
# Tokocrypto has NO native sandbox/testnet.
# Default profile is REAL + allow_real (option A) so the venue is live-ready,
# but order submit remains OFF until dual env confirmation + ProductionGate +
# risk/data/health/permission/preflight all pass. Prefer trade-only API keys
# with withdrawal disabled.
#
# IDX is not a broker here — equity path is signal-only (see settings.yaml idx).

brokers:
  binance:
    mode: DEMO
    sandbox: true
    allow_real: false
  tokocrypto:
    mode: REAL
    sandbox: false
    allow_real: true
  indodax:
    mode: DEMO
    sandbox: true
    allow_real: false
  mt5:
    # No DEMO/REAL UI selector. Detect trade_mode from terminal:
    #   0 DEMO → paper/demo constraints
    #   2 LIVE → real capital path (still subject to dual env + gates)
    mode: FOLLOW_TERMINAL
    sandbox: false
    allow_real: true
    follow_terminal_account: true

real_trading:
  enable_env: NVRA_REAL_TRADING_ENABLE
  confirmation_env: NVRA_REAL_TRADING_CONFIRM
  confirmation_phrase: I_UNDERSTAND_REAL_TRADING

# For exchanges without a native sandbox/testnet, DEMO must use the
# internal paper simulator rather than silently connecting to production.
require_native_demo_for_demo: true
