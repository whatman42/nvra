name: Windows Build

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "packaging/**"
      - "scripts/**"
      - "god/**"
      - "crypto/**"
      - "nvra_unified/**"
      - "tests/**"
      - "requirements.txt"
      - "constraints.txt"
      - ".github/workflows/windows-build.yml"
      - ".github/workflows/build.yml"
      - ".github/workflows/nvra_windows_release.yml"

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          if (Test-Path constraints.txt) {
            pip install -r requirements.txt -c constraints.txt
          } else {
            pip install -r requirements.txt
          }

      - name: pip check
        shell: pwsh
        run: python -m pip check

      - name: Set Python module paths
        shell: pwsh
        run: |
          "PYTHONPATH=$env:GITHUB_WORKSPACE;$env:GITHUB_WORKSPACE\\src" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: GUI import smoke
        shell: pwsh
        run: python -c "from nvra_unified.gui import run_gui; print('GUI_IMPORT_OK')"

      - name: Secret scan
        shell: pwsh
        run: python tools/secret_scan.py

      - name: Full test suite (Windows)
        shell: pwsh
        run: |
          $env:PYTHONPATH = "."
          python -m pytest tests/ -q --tb=line
          if ($LASTEXITCODE -ne 0) { throw "Windows full test suite failed" }

      - name: Build NVRA.exe (single product binary)
        shell: pwsh
        run: |
          python -m PyInstaller packaging/nvra_onefile.spec --noconfirm --clean
          if (-not (Test-Path dist/NVRA.exe)) { throw "NVRA.exe missing" }
          if (Test-Path dist/NVRAFX.exe) { throw "NVRAFX.exe must not be produced as product binary" }
          if (Test-Path dist/NUNG.exe) { throw "NUNG.exe must not be produced" }
          $len = (Get-Item dist/NVRA.exe).Length
          if ($len -lt 1000000) { throw "NVRA.exe unexpectedly small: $len" }
          Write-Host "NVRA.exe size=$len"

      - name: Smoke CLI
        shell: pwsh
        run: |
          function Invoke-NvraCli([string]$CliArg) {
            $p = Start-Process `
              -FilePath ".\\dist\\NVRA.exe" `
              -ArgumentList $CliArg `
              -Wait `
              -PassThru `
              -WindowStyle Hidden
            Write-Host "NVRA $CliArg ExitCode=$($p.ExitCode)"
            if ($null -eq $p.ExitCode) {
              throw "NVRA $CliArg returned null ExitCode (process did not report status)"
            }
            if ($p.ExitCode -ne 0) {
              throw "NVRA $CliArg failed with exit code $($p.ExitCode)"
            }
          }
          Invoke-NvraCli "--version"
          Invoke-NvraCli "--health"
          Invoke-NvraCli "--check-config"

      - name: Actual NVRA.exe headless composition (PAPER)
        shell: pwsh
        run: |
          $results = @()
          for ($i = 0; $i -lt 20; $i++) {
            $p = Start-Process -FilePath ".\\dist\\NVRA.exe" -ArgumentList "--headless" `
              -Wait -PassThru -WindowStyle Hidden
            Write-Host "NVRA --headless run=$i ExitCode=$($p.ExitCode)"
            if ($null -eq $p.ExitCode -or $p.ExitCode -ne 0) {
              throw "NVRA --headless failed run=$i exit=$($p.ExitCode)"
            }
            $results += $p.ExitCode
          }
          $unique = ($results | Select-Object -Unique).Count
          if ($unique -ne 1) { throw "non-deterministic headless exit codes: $($results -join ',')" }
          Write-Host "HEADLESS_COMPOSITION_PASS runs=20 exit=0 live=false"

      - name: Actual NVRA.exe process kill/restart recovery
        shell: pwsh
        run: |
          for ($i = 0; $i -lt 5; $i++) {
            $p = Start-Process -FilePath ".\\dist\\NVRA.exe" -ArgumentList "--headless" `
              -PassThru -WindowStyle Hidden
            Start-Sleep -Milliseconds 200
            if (-not $p.HasExited) {
              Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
              try { $p.WaitForExit(5000) } catch {}
              Write-Host "killed pid=$($p.Id) run=$i"
            } else {
              Write-Host "exited-before-kill code=$($p.ExitCode) run=$i"
            }
            $p2 = Start-Process -FilePath ".\\dist\\NVRA.exe" -ArgumentList "--headless" `
              -Wait -PassThru -WindowStyle Hidden
            Write-Host "restart ExitCode=$($p2.ExitCode) run=$i"
            if ($null -eq $p2.ExitCode -or $p2.ExitCode -ne 0) {
              throw "NVRA --headless restart failed run=$i exit=$($p2.ExitCode)"
            }
          }
          Write-Host "PROCESS_RECOVERY_PASS runs=5 live=false"

      - name: SHA-256 + manifest
        shell: pwsh
        run: |
          $h = Get-FileHash dist/NVRA.exe -Algorithm SHA256
          @"
          NVRA.exe  $($h.Hash)
          "@ | Set-Content -Encoding utf8 SHA256SUMS.txt
          @"
          # NVRA Windows Release Manifest
          Product: NVRA
          Developer: NUNG
          Binary: NVRA.exe (single product — no NVRAFX.exe, no NUNG.exe)
          Console: False (windowed / runw bootloader)
          HEAD: $($env:GITHUB_SHA)
          NVRA.exe SHA256: $($h.Hash)
          Size: $((Get-Item dist/NVRA.exe).Length)
          "@ | Set-Content -Encoding utf8 NVRA_WINDOWS_RELEASE_MANIFEST.md
          Compress-Archive -Path dist/NVRA.exe,SHA256SUMS.txt,NVRA_WINDOWS_RELEASE_MANIFEST.md -DestinationPath NVRA_WINDOWS_RELEASE.zip -Force

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: nvra-windows-release
          path: |
            dist/NVRA.exe
            SHA256SUMS.txt
            NVRA_WINDOWS_RELEASE_MANIFEST.md
            NVRA_WINDOWS_RELEASE.zip
          if-no-files-found: error
